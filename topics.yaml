# Shorts Factory topic config
# enabled: false pauses all work for that topic (kill-switch)

topics:
  - id: medicine
    enabled: true
    display_name: Medicine Facts
    search_queries:
      - "human body animation explained"
      - "medical animation physiology"
      - "anatomy whiteboard explained"
    exclude_keywords:
      - "asmr"
      - "prank"
      - "reaction"
    min_duration_sec: 180
    max_duration_sec: 1200
    min_view_count: 50000
    max_results_per_query: 8
    require_captions: true
    creative_commons_only: false

  - id: sleep_science
    enabled: true
    display_name: Sleep Science
    search_queries:
      - "sleep science animation explained"
      - "circadian rhythm animation"
      - "how sleep works podcast explained"
    exclude_keywords:
      - "asmr"
      - "sleep music"
      - "white noise"
      - "reaction"
    min_duration_sec: 1200
    max_duration_sec: 7200
    min_view_count: 50000
    max_results_per_query: 6
    require_captions: true
    creative_commons_only: false

  - id: brain_performance
    enabled: true
    display_name: Brain Performance
    search_queries:
      - "dopamine animation explained"
      - "neuroscience motion graphics"
      - "brain science podcast explained"
    exclude_keywords:
      - "asmr"
      - "meditation music"
      - "reaction"
    min_duration_sec: 1200
    max_duration_sec: 7200
    min_view_count: 50000
    max_results_per_query: 6
    require_captions: true
    creative_commons_only: false

  - id: psychology_explained
    enabled: true
    display_name: Psychology Explained
    search_queries:
      - "cognitive bias animation"
      - "psychology whiteboard explained"
      - "habits psychology podcast explained"
    exclude_keywords:
      - "asmr"
      - "prank"
      - "reaction"
    min_duration_sec: 1200
    max_duration_sec: 7200
    min_view_count: 50000
    max_results_per_query: 6
    require_captions: true
    creative_commons_only: false

  - id: game_of_thrones
    enabled: false
    display_name: Game of Thrones
    search_queries:
      - "game of thrones explained"
      - "got lore"
    exclude_keywords:
      - "reaction only"
    min_duration_sec: 180
    max_duration_sec: 1200
    min_view_count: 100000
    max_results_per_query: 8
    require_captions: true
    creative_commons_only: false

pipeline:
  discover_interval_minutes: 720
  process_interval_minutes: 60
  publish_interval_minutes: 240
  max_publishes_per_day: 10
  clip_min_seconds: 18
  clip_max_seconds: 45
  jitter_seconds_min: 30
  jitter_seconds_max: 180
  youtube_daily_quota_budget: 8000
  upload_quota_cost: 1600
  # Transcript: YouTube captions first; Whisper only if captions missing
  use_youtube_captions: true
  use_whisper: false
  whisper_model: tiny
  # Highlight picker REQUIRED: gemini | ollama (silence-based cutting removed)
  llm_provider: gemini
  gemini_model: gemini-flash-lite-latest
  ollama_model: llama3.2
  max_llm_highlights_per_day: 25
  # Quality gate + captions (Shorts polish upgrade)
  min_clip_score: 70
  enable_verifier: true
  verifier_soft_floor: 55
  burn_captions: true
  snap_to_sentences: true
  snap_whisper_model: base
  # Multi-Shorts from long sources
  max_clips_per_source: 10
  clip_min_gap_sec: 30
  picker_chunk_sec: 900
  # Originality: only B-roll/animation/diagram clips get VO; talking heads rejected
  enable_narration: true
  narration_routing: auto
  reject_talking_heads: true
  narration_mode: mute_source_vo
  tts_provider: edge_tts
  tts_voice: en-US-AndrewNeural
  narration_max_words: 110
  min_script_novelty: 0.45
  talking_head_motion: true
  talking_head_zoom_end: 1.08
  # Brand cards on VO / B-roll Shorts only
  enable_brand_bumper: true
  # brand_name: null  # defaults to topic display_name
  bumper_intro_sec: 0.75
  bumper_outro_sec: 0.9
  bumper_intro_tagline: "facts in under a minute"
  bumper_outro_tagline: "thanks for watching"
  # Owned kinetic path (POST /process-owned-next) — A/B vs clip factory
  owned_max_words: 110
  owned_enable_bumper: true
  owned_min_script_novelty: 0.40
  # Kinetic cards already reveal VO text; set true to also burn ASS karaoke
  owned_burn_karaoke: false
