# Shorts Factory topic config
# enabled: false pauses all work for that topic (kill-switch)

topics:
  - id: medicine
    enabled: true
    display_name: Medicine Facts
    search_queries:
      - "medical explanation"
      - "how the body works"
      - "doctor explains"
    exclude_keywords:
      - "asmr"
      - "prank"
    min_duration_sec: 180
    max_duration_sec: 1200
    min_view_count: 50000
    max_results_per_query: 8
    require_captions: true
    creative_commons_only: false

  - id: sleep_science
    enabled: true
    display_name: Sleep Science
    search_queries:
      - "sleep science explained"
      - "circadian rhythm explained"
      - "how sleep works podcast"
    exclude_keywords:
      - "asmr"
      - "sleep music"
      - "white noise"
    min_duration_sec: 1200
    max_duration_sec: 7200
    min_view_count: 50000
    max_results_per_query: 6
    require_captions: true
    creative_commons_only: false

  - id: brain_performance
    enabled: true
    display_name: Brain Performance
    search_queries:
      - "dopamine explained"
      - "focus and attention science"
      - "neuroscience learning podcast"
    exclude_keywords:
      - "asmr"
      - "meditation music"
    min_duration_sec: 1200
    max_duration_sec: 7200
    min_view_count: 50000
    max_results_per_query: 6
    require_captions: true
    creative_commons_only: false

  - id: psychology_explained
    enabled: true
    display_name: Psychology Explained
    search_queries:
      - "cognitive bias explained"
      - "habits psychology explained"
      - "motivation psychology podcast"
    exclude_keywords:
      - "asmr"
      - "prank"
    min_duration_sec: 1200
    max_duration_sec: 7200
    min_view_count: 50000
    max_results_per_query: 6
    require_captions: true
    creative_commons_only: false

  - id: game_of_thrones
    enabled: false
    display_name: Game of Thrones
    search_queries:
      - "game of thrones explained"
      - "got lore"
    exclude_keywords:
      - "reaction only"
    min_duration_sec: 180
    max_duration_sec: 1200
    min_view_count: 100000
    max_results_per_query: 8
    require_captions: true
    creative_commons_only: false

pipeline:
  discover_interval_minutes: 720
  process_interval_minutes: 60
  publish_interval_minutes: 240
  max_publishes_per_day: 10
  clip_min_seconds: 18
  clip_max_seconds: 45
  jitter_seconds_min: 30
  jitter_seconds_max: 180
  youtube_daily_quota_budget: 8000
  upload_quota_cost: 1600
  # Transcript: YouTube captions first; Whisper only if captions missing
  use_youtube_captions: true
  use_whisper: false
  whisper_model: tiny
  # Highlight picker REQUIRED: gemini | ollama (silence-based cutting removed)
  llm_provider: gemini
  gemini_model: gemini-flash-lite-latest
  ollama_model: llama3.2
  max_llm_highlights_per_day: 25
  # Quality gate + captions (Shorts polish upgrade)
  min_clip_score: 70
  enable_verifier: true
  verifier_soft_floor: 55
  burn_captions: true
  snap_to_sentences: true
  snap_whisper_model: base
  # Multi-Shorts from long sources
  max_clips_per_source: 10
  clip_min_gap_sec: 30
  picker_chunk_sec: 900
